<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimi Chat Agent</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
      </div>
      <div class="sidebar-label">Recent Chats</div>
      <nav id="session-list" class="session-list"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle sidebar">☰</button>
        <span class="brand">Minimi Agent</span>
        <span id="session-badge" class="session-badge"></span>
      </header>

      <section id="chat-feed" class="chat-feed">
        <div id="empty-state" class="empty-state">
          <h1>What can I help you find?</h1>
          <p>Equipped with live web search and temporal episodic memory.</p>
        </div>
      </section>

      <footer class="composer-wrap">
        <form id="chat-form" class="composer">
          <textarea
            id="prompt-input"
            rows="1"
            placeholder="Ask anything or reference a past conversation..."
            required
          ></textarea>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </footer>
    </main>
  </div>

  <script src="/client.js"></script>
</body>
</html>
